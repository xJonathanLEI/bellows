[workspace]
members = [
    "bellows",
    "interop-tests",
]
resolver = "3"

[workspace.dependencies]
bellows = { path = "./bellows" }
rand = { version = "0.10.0", default-features = false, features = ["thread_rng"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", default-features = false }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
tempfile = "3.26.0"
tokio = { version = "1.49.0", default-features = false, features = ["macros", "rt", "sync"] }
tracing = { version = "0.1.44", default-features = false }

[workspace]
members = [
    "bellows",
    "interop-tests",
    "bellows/tests/integration/cloudflare/producer",
    "bellows/tests/integration/cloudflare/processor",
    "bellows/tests/integration/cloudflare/contracts",
]
resolver = "3"

[workspace.dependencies]
bellows = { path = "./bellows" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
rand = { version = "0.10.0", default-features = false, features = ["thread_rng"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", default-features = false }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
tempfile = "3.26.0"
tokio = { version = "1.49.0", default-features = false, features = ["macros", "sync"] }
tokio-postgres = { version = "0.7.18", default-features = false }
tracing = { version = "0.1.44", default-features = false }
web-time = "1.1.0"
worker = { version = "0.8.5", default-features = false }
